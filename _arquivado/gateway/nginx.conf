# Gateway da PoC: implementa o "strangler pattern" da migração.
#
#   /web/*  → tenta primeiro a stack nova (site). Se a página já foi migrada e publicada,
#             o site responde com redirect para a URL nova. Se ainda não foi (404),
#             a requisição cai no Liferay legado.
#   /*      → stack nova (site Next.js; o CMS Strapi fica em :1337).
#
# Em produção isso seria o API gateway / CDN da Hapvida (ex: Akamai, Cloudflare, Kong).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# DNS do Docker resolvido a cada requisição: se um container for recriado (IP novo),
# o gateway continua funcionando sem precisar reiniciar.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;
  set $site    http://site:3000;
  set $liferay http://liferay-legado:8081;
  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s;

  add_header X-Servido-Por $servido_por always;
  set $servido_por "stack-nova";

  location /web/ {
    proxy_pass $site;
    proxy_intercept_errors on;
    error_page 404 = @liferay;
  }

  # Assets e APIs que só existem no Liferay
  location ~ ^/(o|documents|image|combo)/ {
    set $servido_por "liferay-legado";
    proxy_pass $liferay;
  }

  location @liferay {
    set $servido_por "liferay-legado";
    proxy_pass $liferay;
  }

  location / {
    proxy_pass $site;
  }
}
